[project]
name = "revit-api-docs-mcp"
version = "0.1.0"
description = "Local-first MCP server for retrieving and analyzing Revit API Docs."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "mcp>=1.9.0",
]

[project.scripts]
revit-api-docs-mcp = "revit_api_docs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

