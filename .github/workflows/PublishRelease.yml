name: Publish release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.1.0, 3.1.0-beta.1)"
        required: false
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        run: |
          set -e
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Inject Daemon config
        shell: pwsh
        run: |
          $file = "source/DevTools.Daemon/appsettings.json"
          $json = Get-Content $file | ConvertFrom-Json
          $json.Auth.Issuer = "${{ secrets.AUTH_ISSUER }}"
          $json.Auth.ClientId = "${{ secrets.AUTH_CLIENT_ID }}"
          $json.Gateway.Url = "${{ secrets.GATEWAY_URL }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $file

      - name: Publish packages
        run: dotnet run -c Release -- pack publish
        working-directory: "build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_ENVIRONMENT: Production
          Build__Version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

      - name: Fast-forward develop to include release tag
        if: success()
        shell: bash
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          git fetch origin develop
          git checkout develop
          git merge --no-edit "tags/$TAG" || true
          git push origin develop || echo "::warning::Could not push develop merge. Manual merge needed."