name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      daemon: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.daemon == 'true' }}
      addin: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.addin == 'true' }}
      nettest: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.nettest == 'true' }}
      pytest: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.pytest == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/train-paths.yml

  daemon:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Compile and test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          $arguments = @('run', '--project', 'build', '--', 'ci', 'daemon')
          if ($env:BASE) { $arguments += @('--base', $env:BASE) }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet run --project build -- pack daemon

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon
          path: output/daemon
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-daemon
          path: |
            **/log_*.diag
            **/hangdump*
            **/*.binlog
          if-no-files-found: ignore
          retention-days: 7

  addin:
    needs: changes
    if: needs.changes.outputs.addin == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Compile and test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          $arguments = @('run', '--project', 'build', '--', 'ci', 'addin')
          if ($env:BASE) { $arguments += @('--base', $env:BASE) }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet run --project build -- pack addin

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addin
          path: |
            output/addin/*.zip
            output/addin/update-manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-addin
          path: |
            **/log_*.diag
            **/hangdump*
            **/*.binlog
          if-no-files-found: ignore
          retention-days: 7

  nettest:
    needs: changes
    if: needs.changes.outputs.nettest == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Compile and test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          $arguments = @('run', '--project', 'build', '--', 'ci', 'nettest')
          if ($env:BASE) { $arguments += @('--base', $env:BASE) }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        run: dotnet run --project build -- pack nettest

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nettest
          path: output/nettest/*.nupkg
          if-no-files-found: error
          retention-days: 3

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-nettest
          path: |
            **/log_*.diag
            **/hangdump*
            **/*.binlog
          if-no-files-found: ignore
          retention-days: 7

  pytest:
    needs: changes
    if: needs.changes.outputs.pytest == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: source/RevitDevTool.PyTest/pixi.toml

      - name: Lint and test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          $arguments = @('run', '--project', 'build', '--', 'ci', 'pytest')
          if ($env:BASE) { $arguments += @('--base', $env:BASE) }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        run: dotnet run --project build -- pack pytest

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest
          path: output/pytest
          if-no-files-found: error
          retention-days: 3

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run typecheck

      - name: Build site
        run: bun run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/build

  docs-deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          min-severity: high

  gate:
    if: always()
    needs: [changes, daemon, addin, nettest, pytest, docs, docs-deploy, workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: daemon, addin, nettest, pytest, docs, docs-deploy, workflows
          jobs: ${{ toJSON(needs) }}
