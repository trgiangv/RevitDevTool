name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jobs: ${{ steps.products.outputs.jobs }}
      addin: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.addin == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/product-paths.yml

      - name: List the jobs
        id: products
        env:
          CHANGES: ${{ github.event_name == 'workflow_dispatch' && '["daemon","addin","nettest","pytest"]' || steps.filter.outputs.changes }}
        run: echo "jobs=$(jq -c --argjson changes "$CHANGES" '[.[$changes[]][]?]' .github/ci-jobs.json)" >> "$GITHUB_OUTPUT"

  product:
    needs: changes
    if: needs.changes.outputs.jobs != '[]'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.jobs) }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RUN: ${{ matrix.run }}
      PACK: ${{ matrix.pack }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Restore packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.cache }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ matrix.cache }}-

      - name: Setup pixi
        if: matrix.pack == 'pytest'
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: source/RevitDevTool.PyTest/pyproject.toml

      - name: Build
        run: dotnet run --project build -- @($env:RUN -split ' ')

      - name: Save packages
        if: github.event_name == 'push' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Pack
        if: matrix.pack && (github.event_name == 'push' || matrix.pack == 'nettest')
        run: dotnet run --project build -- pack $env:PACK

      - name: Upload artifacts
        if: matrix.pack && (github.event_name == 'push' || matrix.pack == 'nettest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.pack }}
          path: output/${{ matrix.pack }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload host version
        if: matrix.host_version && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addin-${{ matrix.host_version }}
          path: output/hosts
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.name }}
          path: '**/TestResults/*_hang.*'
          if-no-files-found: ignore
          retention-days: 7

  autodesk-bundle:
    needs: [changes, product]
    if: github.event_name == 'push' && needs.changes.outputs.addin == 'true'
    name: Autodesk bundle
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-bundle-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props', 'dotnet-tools.json') }}
          restore-keys: nuget-bundle-

      - name: Download host versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: addin-*
          path: output/hosts
          merge-multiple: true

      - name: Bundle
        run: dotnet run --project build -- pack addin

      - name: Save packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addin
          path: output/addin
          if-no-files-found: error
          retention-days: 3

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: docs
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check TypeScript
        run: vp run typecheck

      - name: Build site
        run: vp run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  docs-deploy:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          min-severity: high

  result:
    if: always()
    needs: [changes, product, autodesk-bundle, docs, docs-deploy, workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the jobs
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A job failed or was cancelled; see the jobs above."
          exit 1
