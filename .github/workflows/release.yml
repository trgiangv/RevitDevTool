name: release

run-name: release ${{ inputs.product }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to release
        type: choice
        options: [daemon, addin, nettest, pytest]
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
    env:
      PRODUCT: ${{ inputs.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate the release
        id: plan
        run: dotnet run --project build -- release $env:PRODUCT --dry-run

  build:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PRODUCT: ${{ inputs.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up pixi for git-cliff
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: release

      - name: Test and build the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project build -- release $env:PRODUCT

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.product }}
          path: |
            output/${{ inputs.product }}/*.nupkg
            output/${{ inputs.product }}/*.whl
            output/${{ inputs.product }}/*.tar.gz
            output/${{ inputs.product }}/*.exe
            output/${{ inputs.product }}/*.zip
            output/${{ inputs.product }}/*.json
            output/${{ inputs.product }}/notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-release-${{ inputs.product }}
          path: '**/TestResults/*_hang.*'
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [validate, build]
    if: inputs.product != 'pytest'
    runs-on: windows-latest
    environment: ${{ inputs.product }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PRODUCT: ${{ inputs.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.product }}
          path: output/${{ inputs.product }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/${{ inputs.product }}/*.nupkg
            output/${{ inputs.product }}/*.exe
            output/${{ inputs.product }}/*.zip

      - name: Log in to NuGet
        id: login
        if: inputs.product == 'nettest'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          Update__SigningKey: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: dotnet run --project build -- publish $env:PRODUCT

  channels:
    needs: [validate, publish]
    if: inputs.product == 'daemon' || inputs.product == 'addin'
    runs-on: windows-latest
    environment: ${{ inputs.product }}
    concurrency:
      group: channels
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PRODUCT: ${{ inputs.product }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Move the channel
        env:
          GH_TOKEN: ${{ github.token }}
          Update__SigningKey: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: dotnet run --project build -- channels $env:PRODUCT --version $env:VERSION

  verify-install:
    needs: [validate, channels]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      PRODUCT: ${{ inputs.product }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read channels.json
        id: channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/channels/channels.json" -OutFile channels.json
          $index = Get-Content channels.json -Raw | ConvertFrom-Json
          $channel = if ($env:PRERELEASE -eq 'true') { $index.prerelease } else { $index.stable }
          if ($channel.$env:PRODUCT.version -ne $env:VERSION) { throw "channels.json names $env:PRODUCT '$($channel.$env:PRODUCT.version)', not $env:VERSION." }
          "setup=$($channel.daemon.feed)RevitDevTool-Setup.exe" >> $env:GITHUB_OUTPUT
          "addin=$($channel.addin.version)" >> $env:GITHUB_OUTPUT

      - name: Install the published Setup
        shell: pwsh
        env:
          SETUP: ${{ steps.channel.outputs.setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item setup -ItemType Directory -Force | Out-Null
          Invoke-WebRequest $env:SETUP -OutFile setup\RevitDevTool-Setup.exe
          Start-Process setup\RevitDevTool-Setup.exe -ArgumentList '--silent' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'RevitDevTool\current'
          if (-not (Test-Path (Join-Path $app 'DevTools.Daemon.exe'))) { throw "Velopack did not install the Daemon in $app." }
          "APP=$app" >> $env:GITHUB_ENV

      - name: Install payloads with --select
        if: steps.channel.outputs.addin != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $daemon = Join-Path $env:APP 'DevTools.Daemon.exe'
          $arguments = '--select "Revit 2025" --select "AutoCAD 2025"'
          $process = Start-Process $daemon -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput select.out.txt -RedirectStandardError select.err.txt
          Get-Content select.out.txt, select.err.txt
          if ($process.ExitCode -ne 0) { throw "--select exited with $($process.ExitCode)." }

      - name: Check the installation
        if: steps.channel.outputs.addin != ''
        shell: pwsh
        env:
          ADDIN: ${{ steps.channel.outputs.addin }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:APPDATA 'Autodesk\ApplicationPlugins\RevitDevTool.bundle'
          $installation = Get-Content (Join-Path $bundle 'installation.json') -Raw | ConvertFrom-Json
          $payload = $installation.payloads | Where-Object hostVersion -eq '2025'
          if ($payload.version -ne $env:ADDIN) { throw "Payload 2025 is '$($payload.version)', not $env:ADDIN." }

          [xml]$package = Get-Content (Join-Path $bundle 'PackageContents.xml')
          $modules = $package.ApplicationPackage.Components.ComponentEntry.ModuleName
          foreach ($module in './Contents/2025/RevitDevTool.addin', './Contents/2025/AcadDevTool.dll') {
            if ($modules -notcontains $module) { throw "PackageContents.xml has no $module." }
            if (-not (Test-Path (Join-Path $bundle $module))) { throw "$module is not on disk." }
          }
          if (Test-Path (Join-Path $bundle 'Contents\DevTools.Daemon.exe')) { throw 'The bundle must not contain the Daemon.' }

      - name: Start the MCP server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item empty.txt -ItemType File -Force | Out-Null
          $mcp = Start-Process (Join-Path $env:APP 'DevTools.Daemon.exe') -ArgumentList '--stdio' -PassThru -RedirectStandardInput empty.txt -RedirectStandardOutput mcp.out.txt -RedirectStandardError mcp.err.txt
          if (-not $mcp.WaitForExit(60000)) { $mcp.Kill(); throw 'DevTools.Daemon.exe --stdio did not stop when its input ended.' }
          if ($mcp.ExitCode -ne 0) { Get-Content mcp.err.txt; throw "DevTools.Daemon.exe --stdio exited with $($mcp.ExitCode)." }

      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          gh issue create -R $env:GITHUB_REPOSITORY --label bug `
            --title "Release install test failed: $env:PRODUCT $env:VERSION" `
            --body "The install test of $env:PRODUCT $env:VERSION failed: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

  publish-pytest:
    needs: [validate, build]
    if: inputs.product == 'pytest'
    runs-on: ubuntu-latest
    environment: pytest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pytest
          path: output/pytest

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/pytest/*.whl
            output/pytest/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: output/pytest
          skip-existing: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          flags=(--target "$SHA" --title "revitdevtool-pytest $VERSION" --notes-file output/pytest/notes.md --latest=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" output/pytest/*.whl output/pytest/*.tar.gz
