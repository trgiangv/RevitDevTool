[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revitdevtool_pytest"
version = "0.6.1"
description = "pytest plugin for testing CAD/BIM API code inside host applications via RevitDevTool Named Pipe bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Truong Giang Vu" }]
keywords = ["pytest", "revit", "autocad", "civil3d", "revit-api", "testing", "bim", "multi-host", "revitdevtool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=9.1.1,<10", "pywin32>=312"]

[project.entry-points."pytest11"]
revitdevtool = "revitdevtool_pytest.plugin"

[project.urls]
Homepage = "https://github.com/trgiangv/RevitDevTool"
Repository = "https://github.com/trgiangv/RevitDevTool"
Issues = "https://github.com/trgiangv/RevitDevTool/issues"
Changelog = "https://github.com/trgiangv/RevitDevTool/blob/develop/source/RevitDevTool.PyTest/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/revitdevtool_pytest"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = ["UP032", "UP009", "FLY002"]
