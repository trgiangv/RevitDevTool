[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revitdevtool_pytest"
version = "0.3.0"
description = "pytest plugin for testing CAD/BIM API code inside host applications via RevitDevTool Named Pipe bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Truong Giang Vu" }]
keywords = ["pytest", "revit", "autocad", "civil3d", "revit-api", "testing", "bim", "multi-host", "revitdevtool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=9.0", "pywin32>=311"]

[project.entry-points."pytest11"]
revitdevtool = "revitdevtool_pytest.plugin"

[project.urls]
Homepage = "https://github.com/trgiangv/RevitDevTool.PyTest"
Repository = "https://github.com/trgiangv/RevitDevTool.PyTest"
Issues = "https://github.com/trgiangv/RevitDevTool.PyTest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/revitdevtool_pytest"]

[tool.pytest.ini_options]
# testpaths = ["tests/Revit"]
# host_name = "revit"
# host_version = "2025"
testpaths = ["tests/Civil3d"]
host_name = "civil3d"
host_version = "2026"
host_timeout = "60"
host_launch = false
host_launch_timeout = "180"
