[workspace]
name = "revitdevtool-pytest"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.13.*"
ruff = "*"
python-build = "*"
hatchling = "*"

[pypi-dependencies]
revitdevtool_pytest = { path = ".", editable = true }

[tasks]
lint = "ruff check src tests/plugin tests/golden && ruff format --check src tests/plugin tests/golden"
test = "pytest tests/plugin tests/golden"
build = "python -m build --no-isolation"
live = "pytest -c tests/live.ini --rootdir ."
